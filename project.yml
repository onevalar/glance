name: Glance
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Glance:
    type: application
    platform: macOS
    sources:
      - path: Sources/Glance
        excludes:
          - Info.plist
          - Glance.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.Glance
        PRODUCT_NAME: Glance
        INFOPLIST_FILE: Sources/Glance/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Glance/Glance.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local test builds are signed ad hoc; set DEVELOPMENT_TEAM in Xcode for distribution.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  GlanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GlanceTests
    dependencies:
      - target: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.GlanceTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Glance.app/Contents/MacOS/Glance
        CODE_SIGN_IDENTITY: "-"
schemes:
  Glance:
    build:
      targets:
        Glance: all
    test:
      targets:
        - GlanceTests
    run:
      config: Debug
